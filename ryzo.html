<!DOCTYPE html>
<html>

<head>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ryzo Kaveh — The Vessel: Awakening</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --accent: #b3122f;
            --accent-light: #e63956;

            --dark-bg: #090a0d;
            --dark-nav: #12141a;
            --dark-card: #151820;
            --dark-border: #292d36;

            --light-bg: #f4f5f7;
            --light-card: #ffffff;
            --light-border: #d8dbe1;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: var(--dark-bg);

            color: #ffffff;

            transition:
                background 0.4s,
                color 0.4s;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {

            min-height: 65px;

            background: var(--dark-nav);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            border-bottom:
                1px solid var(--dark-border);

            box-shadow:
                0 4px 20px rgba(0,0,0,0.25);

            transition:
                background 0.4s,
                border-color 0.4s;
        }


        /* LOGO */

        .logo {

            font-size: 17px;

            font-weight: bold;

            letter-spacing: 2px;

            white-space: nowrap;

            position: relative;

            padding-left: 15px;
        }


        .logo::before {

            content: "";

            position: absolute;

            left: 0;

            top: 50%;

            transform: translateY(-50%);

            width: 4px;

            height: 24px;

            background: var(--accent);

            border-radius: 3px;

            box-shadow:
                0 0 10px rgba(179,18,47,0.5);
        }


        /* NAV LINKS */

        nav a {

            position: relative;

            color: #bfc3ca;

            text-decoration: none;

            margin-left: 20px;

            padding: 22px 0 19px;

            font-size: 14px;

            transition:
                color 0.25s;
        }


        nav a::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: 0;

            width: 0;

            height: 2px;

            background: var(--accent);

            transition: width 0.25s;
        }


        nav a:hover {

            color: white;
        }


        nav a:hover::after {

            width: 100%;
        }


        /* ACTIVE PAGE */

        nav a.active {

            color: #ffffff;

            font-weight: bold;
        }


        nav a.active::after {

            width: 100%;
        }


        /* =========================
           THEME BUTTON
        ========================= */

        #themeToggle {

            margin-left: 20px;

            padding: 8px 13px;

            border: 1px solid #3b404a;

            background: #1b1e26;

            color: #eeeeee;

            border-radius: 6px;

            cursor: pointer;

            transition:
                background 0.3s,
                color 0.3s,
                border-color 0.3s,
                transform 0.2s;
        }


        #themeToggle:hover {

            border-color: var(--accent);

            transform: translateY(-1px);
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            max-width: 900px;

            margin: auto;

            padding: 35px 20px 60px;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back {

            display: inline-block;

            margin-bottom: 30px;

            color: #aeb2ba;

            text-decoration: none;

            font-size: 15px;

            transition: color 0.2s;
        }


        .back:hover {

            color: var(--accent-light);
        }


        /* =========================
           CHARACTER IMAGE
        ========================= */

        .character-image {

            width: 100%;

            max-width: 500px;

            height: auto;

            display: block;

            margin: 0 auto 30px;

            border-radius: 10px;

            background: var(--dark-card);

            border: 1px solid var(--dark-border);

            box-shadow:
                0 15px 40px rgba(0,0,0,0.35);

            transition:
                border-color 0.3s,
                box-shadow 0.3s;
        }


        .character-image:hover {

            border-color: var(--accent);

            box-shadow:
                0 15px 45px rgba(179,18,47,0.18);
        }


        /* =========================
           TITLE
        ========================= */

        h1 {

            text-align: center;

            font-size: 42px;

            margin: 0 0 7px;

            letter-spacing: 1px;
        }


        .subtitle {

            text-align: center;

            color: #aeb2ba;

            font-size: 17px;

            margin-bottom: 40px;
        }


        /* =========================
           INFO CARD
        ========================= */

        .info {

            background: var(--dark-card);

            padding: 22px 25px;

            border-radius: 8px;

            margin-bottom: 40px;

            border:
                1px solid var(--dark-border);

            border-left:
                3px solid var(--accent);

            transition:
                background 0.4s,
                border-color 0.4s;
        }


        .info p {

            margin: 9px 0;

            color: #d8dbe1;

            line-height: 1.6;
        }


        .info strong {

            color: #ffffff;
        }


        /* =========================
           SECTIONS
        ========================= */

        .section {

            margin-bottom: 40px;
        }


        h2 {

            position: relative;

            border-left:
                4px solid var(--accent);

            padding-left: 13px;

            font-size: 25px;

            margin-bottom: 18px;

            color: var(--accent-light);

            letter-spacing: 0.5px;
        }


        p {

            color: #c7cbd2;

            line-height: 1.85;

            font-size: 16px;
        }


        ul {

            padding-left: 25px;
        }


        li {

            color: #c7cbd2;

            margin-bottom: 11px;

            line-height: 1.7;
        }


        li::marker {

            color: var(--accent-light);
        }

           FOOTER
        ========================= */

        .footer {

            text-align: center;

            color: #666b74;

            margin-top

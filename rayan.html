<!DOCTYPE html>
<html>

<head>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rayan — The Vessel: Awakening</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --accent: #60a5fa;
            --accent-soft: rgba(96, 165, 250, 0.18);
            --accent-glow: rgba(96, 165, 250, 0.30);
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #08090d;
            color: #f5f5f5;

            transition:
                background 0.4s,
                color 0.4s;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            min-height: 65px;

            background: rgba(13, 14, 20, 0.96);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid #272936;

            transition:
                background 0.4s,
                border-color 0.4s;
        }


        .logo {
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 2px;
            white-space: nowrap;

            color: #ffffff;
        }


        nav a {
            color: #b9bbc7;

            text-decoration: none;

            margin-left: 20px;

            font-size: 14px;

            transition:
                color 0.25s,
                text-shadow 0.25s;
        }


        nav a:hover {
            color: var(--accent);

            text-shadow:
                0 0 12px var(--accent-glow);
        }


        /* ACTIVE NAV */

        nav a.active {
            color: var(--accent);

            font-weight: bold;

            text-shadow:
                0 0 12px var(--accent-glow);
        }


        /* =========================
           THEME BUTTON
        ========================= */

        #themeToggle {

            margin-left: 20px;

            padding: 8px 12px;

            border: 1px solid #3b3d4a;

            background: #181a23;

            color: #f5f5f5;

            border-radius: 6px;

            cursor: pointer;

            transition: 0.3s;
        }


        #themeToggle:hover {

            border-color: var(--accent);

            color: var(--accent);

            box-shadow:
                0 0 12px var(--accent-soft);
        }


        /* =========================
           MAIN
        ========================= */

        .container {

            max-width: 900px;

            margin: auto;

            padding: 30px 20px;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back {

            display: inline-block;

            margin-bottom: 25px;

            color: #9da0ae;

            text-decoration: none;

            font-size: 15px;

            transition:
                color 0.25s;
        }


        .back:hover {

            color: var(--accent);
        }


        /* =========================
           CHARACTER IMAGE
        ========================= */

        .character-image {

            width: 100%;

            max-width: 500px;

            height: auto;

            display: block;

            margin: 0 auto 30px;

            border-radius: 12px;

            background: #11131b;

            border: 1px solid #30323f;

            transition:
                border-color 0.3s,
                box-shadow 0.3s;
        }


        .character-image:hover {

            border-color: var(--accent);

            box-shadow:
                0 0 25px var(--accent-soft);
        }


        /* =========================
           TITLE
        ========================= */

        h1 {

            text-align: center;

            font-size: 42px;

            margin: 0 0 5px;

            color: var(--accent);

            letter-spacing: 1px;

            text-shadow:
                0 0 20px var(--accent-soft);
        }


        .subtitle {

            text-align: center;

            color: #a8aab7;

            font-size: 18px;

            margin-bottom: 40px;
        }


        /* =========================
           INFO
        ========================= */

        .info {

            background: #11131b;

            padding: 20px;

            border-radius: 10px;

            margin-bottom: 30px;

            border: 1px solid #292c38;

            transition:
                background 0.4s,
                border-color 0.4s;
        }


        .info p {

            margin: 8px 0;

            color: #d8dae2;
        }


        .info strong {

            color: var(--accent);
        }


        /* =========================
           SECTIONS
        ========================= */

        .section {

            margin-bottom: 35px;
        }


        h2 {

            border-left:
                4px solid var(--accent);

            padding-left: 12px;

            font-size: 25px;

            margin-bottom: 15px;

            color: var(--accent);

            text-shadow:
                0 0 12px var(--accent-soft);
        }


        p {

            color: #d0d2da;

            line-height: 1.8;

            font-size: 17px;
        }


        ul {

            padding-left: 25px;
        }


        li {

            color: #d0d2da;

            margin-bottom: 10px;

            line-height: 1.6;
        }


        li::marker {

            color: var(--accent);
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            text-align: center;

            color: #696c78;

            margin-top: 50px;

            padding-top: 25px;

            padding-bottom: 20px;

            border-top: 1px solid #242631;
        }


        /* =========================
           LIGHT MODE
        ========================= */

        .light-mode {

            background: #f5f6fa;

            color: #111218;
        }


        .light-mode nav {

            background: rgba(255,255,255,0.96);

            border-bottom-color: #dcdde5;
        }


        .light-mode .logo {

            color: #111218;
        }


        .light-mode nav a {

            color: #454752;
        }


        .light-mode nav a:hover,

        .light-mode nav a.active {

            color: #3b82d0;

            text-shadow: none;
        }


        .light-mode #themeToggle {

            background: #f0f0f5;

            color: #22232b;

            border-color: #bfc1cc;
        }


        .light-mode #themeToggle:hover {

            border-color: #3b82d0;

            color: #3b82d0;

            box-shadow: none;
        }


        .light-mode .back {

            color: #555863;
        }


        .light-mode .back:hover {

            color: #3b82d0;
        }


        .light-mode .subtitle {

            color: #60626d;
        }


        .light-mode .character-image {

            background: #eeeeF3;

            border-color: #d0d1da;
        }

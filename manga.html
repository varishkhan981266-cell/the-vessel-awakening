<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manga — The Vessel: Awakening</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #090909;

            color: #f5f5f5;

            transition:
                background 0.4s ease,
                color 0.4s ease;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {

            min-height: 68px;

            background:
                linear-gradient(
                    90deg,
                    #090909,
                    #160707,
                    #090909
                );

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            border-bottom:
                1px solid #4b1717;

            box-shadow:
                0 3px 18px rgba(0,0,0,0.5);

            transition:
                background 0.4s ease,
                border-color 0.4s ease,
                box-shadow 0.4s ease;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            font-size: 17px;

            font-weight: bold;

            letter-spacing: 2px;

            color: #f5f5f5;

            position: relative;

            padding-left: 28px;

            white-space: nowrap;
        }


        .logo::before {

            content: "";

            position: absolute;

            left: 0;

            top: 50%;

            width: 15px;

            height: 15px;

            transform:
                translateY(-50%)
                rotate(45deg);

            background:
                linear-gradient(
                    135deg,
                    #ff3b3b,
                    #7a0000
                );

            box-shadow:
                0 0 10px
                rgba(255,40,40,0.5);
        }


        /* =========================
           NAV LINKS
        ========================= */

        nav a {

            color: #cfcfcf;

            text-decoration: none;

            margin-left: 20px;

            font-size: 14px;

            transition:
                color 0.25s ease,
                text-shadow 0.25s ease;
        }


        nav a:hover {

            color: #ff4b4b;

            text-shadow:
                0 0 8px
                rgba(255,50,50,0.4);
        }


        nav a.active {

            color: #ff4b4b;

            text-shadow:
                0 0 8px
                rgba(255,50,50,0.4);
        }


        /* =========================
           THEME BUTTON
        ========================= */

        #themeToggle {

            margin-left: 20px;

            padding: 8px 13px;

            border:
                1px solid #6b2222;

            background:
                #1a0b0b;

            color:
                #f5f5f5;

            border-radius:
                6px;

            cursor:
                pointer;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                transform 0.2s ease;
        }


        #themeToggle:hover {

            background:
                #300d0d;

            border-color:
                #a83232;

            box-shadow:
                0 0 10px
                rgba(255,40,40,0.25);

            transform:
                translateY(-1px);
        }


        /* =========================
           PAGE HEADER
        ========================= */

        .page-header {

            text-align: center;

            padding:
                75px 20px 55px;

            background:

                radial-gradient(
                    circle at center,
                    rgba(115,0,0,0.35),
                    transparent 55%
                ),

                linear-gradient(
                    180deg,
                    #130606,
                    #080808
                );

            border-bottom:
                1px solid #351010;
        }


        .page-header h1 {

            margin: 0;

            font-size: 45px;

            letter-spacing: 6px;

            color: #ff3b3b;

            text-shadow:
                0 0 15px
                rgba(255,30,30,0.25);
        }


        .page-header p {

            color: #a8a8a8;

            margin-top: 15px;

            font-size: 15px;
        }


        /* =========================
           MANGA CONTAINER
        ========================= */

        .manga-container {

            max-width: 1000px;

            margin: auto;

            padding:
                60px 20px;
        }


        /* =========================
           VOLUME TITLE
        ========================= */

        .volume-title {

            text-align: center;

            font-size: 30px;

            margin-bottom: 35px;

            letter-spacing: 3px;

            color: #ff4545;

            position: relative;
        }


        .volume-title::after {

            content: "";

            display: block;

            width: 70px;

            height: 2px;

            margin:
                12px auto 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff3333,
                    transparent
                );
        }


        /* =========================
           MANGA CARD
        ========================= */

        .manga-card {

            background:
                linear-gradient(
                    145deg,
                    #151515,
                    #101010
                );

            border:
                1px solid #292929;

            padding:
                30px;

            margin-bottom:
                25px;

            text-align:
                center;

            transition:
                transform 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                background 0.4s ease;
        }


        .manga-card:hover {

            transform:
                translateY(-5px);

            border-color:
                #7d2525;

            box-shadow:

                0 10px 30px
                rgba(0,0,0,0.45),

                0 0 18px
                rgba(150,0,0,0.12);
        }


        /* =========================
           MANGA COVER
        ========================= */

        .manga-cover {

            display: block;

            width: 100%;

            max-width: 350px;

            height: auto;

            margin:
                0 auto 25px;

            border:
                1px solid #444444;

            border-radius:
                5px;

            transition:
                transform 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }


        .manga-cover:hover {

            transform:
                scale(1.015);

            border-color:
                #8f2929;

            box-shadow:
                0 0 20px
                rgba(150,0,0,0.18);
        }


        /* =========================
           MANGA TITLE
        ========================= */

        .manga-card h2 {

            margin:
                10px 0;

            color:
                #eeeeee;

            transition:
                color 0.3s ease;
        }


        .manga-card:hover h2 {

            color:
                #ff4545;
        }


        .manga-card p {

            color:
                #999999;

            line-height:
                1.7;
        }


        /* =========================
           READ BUTTON
        ========================= */

        .read-button {

            display:
                inline-block;

            padding:
                11px 22px;

            background:
                linear-gradient(
                    135deg,
                    #f5f5f5,
                    #d7d7d7
                );

            color:
                #090909;

            text-decoration:
                none;

            font-weight:
                bold;

            margin-top:
                10px;

            border-radius:
                4px;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                box-shadow 0.3s ease,
                transform 0.3s ease;
        }


        .read-button:hover {

            background:
                #ff3d3d;

            color:
                white;

            box-shadow:
                0 0 15px
                rgba(255,40,40,0.35);

            transform:
                translateY(-2px);
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            text-align:
                center;

            padding:
                30px;

            background:
                #070707;

            color:
                #666666;

            font-size:
                13px;

            border-top:
                1px solid #222222;
        }


        /* =================================================
           LIGHT MODE
        ================================================= */

        body.light-mode {

            background:
                #f4f4f4;

            color:
                #111111;
        }


        /* NAV */

        body.light-mode nav {

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #f7eeee,
                    #ffffff
                );

            border-bottom-color:
                #d8bebe;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.08);
        }


        body.light-mode .logo {

            color:
                #161616;
        }


        body.light-mode nav a {

            color:
                #333333;
        }


        body.light-mode nav a:hover,
        body.light-mode nav a.active {

            color:
                #a00000;
        }


        body.light-mode #themeToggle {

            background:
                #f3eeee;

            color:
                #222222;

            border-color:
                #b88d8d;
        }


        body.light-mode #themeToggle:hover {

            background:
                #eadada;

            border-color:
                #a34b4b;
        }


        /* HEADER */

        body.light-mode .page-header {

            background:

                radial-gradient(
                    circle at center,
                    rgba(150,0,0,0.08),
                    transparent 60%
                ),

                linear-gradient(
                    180deg,
                    #fffafa,
                    #f1f1f1
                );

            border-bottom-color:
                #dddddd;
        }


        body.light-mode .page-header h1 {

            color:
                #8f0000;

            text-shadow:
                none;
        }


        body.light-mode .page-header p {

            color:
                #666666;
        }


        /* VOLUME */

        body.light-mode .volume-title {

            color:
                #8f0000;
        }


        /* CARD */

        body.light-mode .manga-card {

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #f7f7f7
                );

            border-color:
                #d2d2d2;
        }


        body.light-mode .manga-card:hover {

            border-color:
                #b46a6a;

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.08);
        }


        body.light-mode .manga-card h2 {

            color:
                #222222;
        }


        body.light-mode .manga-card:hover h2 {

            color:
                #990000;
        }


        body.light-mode .manga-card p {

            color:
                #555555;
        }


        /* COVER */

        body.light-mode .manga-cover {

            border-color:
                #cccccc;
        }


        /* BUTTON */

        body.light-mode .read-button {

            background:
                #151515;

            color:
                white;
        }


        body.light-mode .read-button:hover {

            background:
                #a00000;

            color:
                white;
        }


        /* FOOTER */

        body.light-mode footer {

            background:
                #ffffff;

            color:
                #666666;

            border-top-color:
                #dddddd;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            nav {

                padding:
                    10px 15px;

                flex-wrap:
                    wrap;

                gap:
                    8px;
            }


            .logo {

                font-size:
                    14px;
            }


            nav a {

                margin-left:
                    7px;

                font-size:
                    11px;
            }


            #themeToggle {

                margin-left:
                    5px;

                padding:
                    6px 8px;

                font-size:
                    11px;
            }


            .page-header {

                padding:
                    55px 15px 40px;
            }


            .page-header h1 {

                font-size:
                    32px;

                letter-spacing:
                    4px;
            }


            .manga-container {

                padding:
                    40px 15px;
            }


            .manga-card {

                padding:
                    20px;
            }


            .volume-title {

                font-size:
                    25px;
            }


            .manga-cover {

                max-width:
                    100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav>

        <div class="logo">
            THE VESSEL
        </div>


        <div>

            <a href="index.html">
                Home
            </a>

            <a href="world.html">
                World
            </a>

            <a href="news.html">
                News
            </a>

            <a
                href="manga.html"
                class="active">

                Manga

            </a>

            <a href="characters.html">
                Characters
            </a>

        </div>


        <button
            id="themeToggle"
            onclick="toggleTheme()">

            ☀️ Light

        </button>

    </nav>


    <!-- =========================
         PAGE HEADER
    ========================= -->

    <div class="page-header">

        <h1>
            MANGA
        </h1>

        <p>
            Read The Vessel: Awakening
        </p>

    </div>


    <!-- =========================
         MANGA
    ========================= -->

    <main class="manga-container">


        <h2 class="volume-title">
            VOLUME 1
        </h2>


        <!-- =========================
             CHAPTER 1
        ========================= -->

        <div class="manga-card">


            <!--
                IMPORTANT:
                GitHub repository me image yahan honi chahiye:

                manga/cover.jpg
            -->

            <img
                class="manga-cover"
                src="manga/cover.jpg"
                alt="The Vessel: Awakening Volume 1 Cover">


            <h2>
                Chapter 1 — The Beginning
            </h2>


            <p>
                The story begins...
            </p>


            <a
                class="read-button"
                href="manga-reader.html">

                Read Manga →

            </a>


        </div>


        <!-- =========================
             CHAPTER 2
        ========================= -->

        <div class="manga-card">

            <h2>
                Chapter 2 — Awakening of Urja
            </h2>

            <p>
                Coming soon...
            </p>

        </div>


        <!-- =========================
             CHAPTER 3
        ========================= -->

        <div class="manga-card">

            <h2>
                Chapter 3 — Shadow of the Past
            </h2>

            <p>
                Coming soon...
            </p>

        </div>


    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        © 2026 The Vessel: Awakening

    </footer>


    <!-- =========================
         THEME SCRIPT
    ========================= -->

    <script>

        function toggleTheme() {

            document.body.classList.toggle(
                "light-mode"
            );


            const button =
                document.getElementById(
                    "themeToggle"
                );


            if (
                document.body.classList.contains(
                    "light-mode"
                )
            ) {

                button.innerHTML =
                    "🌙 Dark";

                localStorage.setItem(
                    "theme",
                    "light"
                );

            }

            else {

                button.innerHTML =
                    "☀️ Light";

                localStorage.setItem(
                    "theme",
                    "dark"
                );

            }

        }


        /* =========================
           REMEMBER THEME
        ========================= */

        if (
            localStorage.getItem(
                "theme"
            ) === "light"
        ) {

            document.body.classList.add(
                "light-mode"
            );


            document.getElementById(
                "themeToggle"
            ).innerHTML =
                "🌙 Dark";

        }

    </script>


</body>

</html>
